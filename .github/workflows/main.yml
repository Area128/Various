name: Get latest release version
on:
  # schedule:
  #   - cron:  '51 */6 * * *'
  workflow_dispatch:
jobs:
  get-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          token: ${{ github.token }}

      - name: Fetch release version
        id: latestrelease
        run: echo "latestrelease=$( curl -sL https://api.github.com/repos/ZZJHONS/Bricksync/releases/latest | jq -r '.tag_name' )" >> $GITHUB_OUTPUT

      - name: Check fetched value is not null
        if: ${{ steps.latestrelease.outputs.latestrelease == 'null' }}
        run: exit 1

      - name: Check if we have build this image before
        id: check-cli-docker-image-tag
        shell: bash
        run: |
          curl -H "Authorization: Bearer QQ==" -H 'Accept: application/vnd.oci.image.index.v1+json' https://ghcr.io/v2/area128/bricksync-docker/manifests/cli-${{ steps.latestrelease.outputs.latestrelease }} > response.out
          Err=$(jq '.errors' -r response.out)
          echo $Err
          cat response.out
          if [[ $Err ]]
          then
            echo "exists=0" >> $GITHUB_OUTPUT;
          else
            echo "exists=1" >> $GITHUB_OUTPUT;
          fi

      - if: ${{ steps.check-cli-docker-image-tag.outputs.exists == true }}
        run: echo "image tag exists"
      - if: ${{ steps.check-cli-docker-image-tag.outputs.exists != true }}
        run: echo "image tag does not exist"